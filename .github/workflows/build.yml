name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --org com.fatih --project-name kelime_cemberi .
      - run: cp kelime_main.dart lib/main.dart
      - run: flutter pub add shared_preferences
      - run: sed -i 's/android:label="[^"]*"/android:label="Kelime Çemberi"/' android/app/src/main/AndroidManifest.xml
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kelime-cemberi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
